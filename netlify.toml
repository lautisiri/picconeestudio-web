[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"

# Netlify Blobs (used by /api/contact) works automatically in the Netlify
# runtime context — no extra environment variables are required in
# production. NETLIFY_BLOBS_CONTEXT is injected automatically by Netlify.
